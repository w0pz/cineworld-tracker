# Publishes the tracker page to GitHub Pages.
# cineworld.ie blocks requests from GitHub's servers, so the checks run on your PC (node server.js),
# which pushes data/state.json here. This workflow only rebuilds the page from that file.
name: Deploy page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/configure-pages@v5
      - name: Build the page from data/state.json
        run: node server.js --build --out site
        env:
          STATIC_SITE: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
